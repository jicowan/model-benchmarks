{{- if .Values.ingress.enabled }}
{{- $tlsSource := .Values.ingress.tls.source | default "none" -}}
{{- $scheme := .Values.ingress.scheme | default "internet-facing" -}}
{{- /* PRD-68 P6 (Sec M1): refuse to render an auth-less control plane on a
       public ALB. Operators who front an internal ALB with a VPN can set
       ingress.scheme=internal, or explicitly acknowledge the exposure with
       ingress.allowAuthDisabled=true. */ -}}
{{- if and .Values.cognito.authDisabled (eq $scheme "internet-facing") (not .Values.ingress.allowAuthDisabled) }}
{{- fail "cognito.authDisabled=true with an internet-facing ingress would expose the full admin API unauthenticated. Set ingress.scheme=internal, enable Cognito, or set ingress.allowAuthDisabled=true to override." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "accelbench.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "accelbench.labels" . | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/scheme: {{ $scheme }}
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    {{- if ne $tlsSource "none" }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: {{ required "ingress.tls.certificateArn is required when ingress.tls.source is acm-route53 or acm-existing" .Values.ingress.tls.certificateArn | quote }}
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    {{- else }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    {{- end }}
spec:
  ingressClassName: alb
  rules:
    - host: {{ required "ingress.host is required when ingress.enabled=true" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "accelbench.fullname" . }}-api
                port:
                  number: {{ .Values.api.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "accelbench.fullname" . }}-web
                port:
                  number: {{ .Values.web.port }}
{{- end }}
