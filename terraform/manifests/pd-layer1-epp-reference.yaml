# PRD-58 Layer 1 — EPP + InferencePool KV-aware routing on top of the validated
# Layer 0 PD pods (prefill+decode Deployments, NIXL/TCP, decode sidecar).
# Docs-grounded (llm-d-inference-scheduler v0.9.0 + gateway-api-inference-extension
# v1.5.0); every non-Layer-0 piece traces to an upstream reference file.
# Namespace: llm-d-pd. Requires: multinode-test pool scaled up + reaper lock.
#
# WHAT CHANGES vs Layer 0: the sidecar STAYS (it executes the KV hand-off); the
# EPP replaces the *manual* x-prefiller-url with dynamic per-request endpoint
# selection (x-prefiller-host-port). One InferencePool spans BOTH roles; the EPP
# splits prefill/decode internally via the llm-d.ai/role label filters.
#
# ── STATUS: VALIDATED on g6/TCP (2026-07-31) ────────────────────────────────
# Proven on 2×g6.2xlarge (L4), Qwen2.5-1.5B, TCP NIXL. Two chat requests through
# gateway→InferencePool→EPP→decode-sidecar→prefill(KV over TCP)→decode returned
# 200 with coherent output. Decisive per-role metrics (prompts were 55 + 60 tok):
#   prefill pod: prompt_tokens_total=115, generation_tokens_total≈0
#   decode  pod: prompt_tokens_total=115, generation_tokens_total=120  (80+40)
# Both roles saw ALL prompt tokens (prefill computed KV; decode pulled it over
# NIXL/TCP) while ONLY decode generated output — the textbook disaggregated-PD
# signature. The prefill pod is on a separate node with no direct gateway route,
# so its 115 prompt tokens can only have come from the EPP selecting it +
# threading the handoff. EPP KV-aware routing across roles = PROVEN.
#
# ── GATEWAY PREREQUISITE (shared EnvoyGateway config — NOT in this file) ─────
# A GA inference.networking.k8s.io/v1 InferencePool backendRef is REJECTED by
# Envoy Gateway 1.8.3 (ResolvedRefs=False InvalidKind) until the pool CRD group
# is registered as a permitted backend kind in the EnvoyGateway config:
#   extensionManager:
#     backendResources:
#     - {group: inference.networking.k8s.io, kind: InferencePool, version: v1}
# (from envoyproxy/ai-gateway v1.0.0 examples/inference-pool/
# envoy-gateway-values-addon.yaml) + restart deploy/envoy-gateway. The
# envoy-gateway SA also needs cluster-read on inferencepools — the AI Gateway
# Helm install already provides this (ClusterRole
# envoy-ai-gateway-inference-pool-reader). The shipped feature must add the
# backendResources entry to the Terraform/Helm EnvoyGateway values (gateway.tf).
# Our gateway's allowedRoutes.namespaces.from:All means cross-ns route→gateway
# attachment needs no ReferenceGrant.
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: pd-gpu
  namespace: llm-d-pd
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.nvidia.com
            count: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefill
  namespace: llm-d-pd
  labels: { llm-d.ai/role: prefill, app: pd-prefill }
spec:
  replicas: 1
  selector:
    matchLabels: { llm-d.ai/role: prefill, app: pd-prefill }
  template:
    metadata:
      # Pool-selector labels (llm-d.ai/inference-serving + llm-d.ai/model) so the
      # InferencePool selector catches this pod; llm-d.ai/role drives the EPP's
      # prefill-filter. (nixl-qwen-prefiller-pod.yaml @ v0.9.0)
      labels:
        llm-d.ai/role: prefill
        app: pd-prefill
        llm-d.ai/inference-serving: "true"
        llm-d.ai/model: qwen2-5-1-5b
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { llm-d.ai/role: decode }
              topologyKey: kubernetes.io/hostname
      tolerations:
        - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
        - { key: accelbench.io/multinode, operator: Equal, value: "true", effect: NoSchedule }
      nodeSelector: { accelbench.io/dra: "true" }
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: pd-gpu
      containers:
        - name: modelserver
          image: vllm/vllm-openai:v0.25.0
          command: ["vllm", "serve"]
          args:
            - "Qwen/Qwen2.5-1.5B-Instruct"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
            - "--tensor-parallel-size=1"
            - "--block-size=128"
            - "--kv-transfer-config"
            - '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
            - "--no-disable-hybrid-kv-cache-manager"
          env:
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: VLLM_NIXL_SIDE_CHANNEL_PORT
              value: "5600"
            - name: UCX_TLS
              value: "tcp,cuda_copy,cuda_ipc"
            - name: UCX_NET_DEVICES
              value: "all"
            - name: UCX_MODULE_DIR
              value: "/usr/local/lib/python3.12/dist-packages/nixl_cu13.libs/ucx"
            - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
              value: "120"
            - name: VLLM_LOGGING_LEVEL
              value: "DEBUG"
          ports:
            - { name: modelserver, containerPort: 8000, protocol: TCP }
            - { name: nixl, containerPort: 5600, protocol: TCP }
          resources:
            requests: { cpu: "3", memory: 12Gi }
            limits:   { memory: 12Gi }
            claims:   [ { name: gpu } ]
          volumeMounts:
            - { name: shm, mountPath: /dev/shm }
          readinessProbe:
            httpGet: { path: /v1/models, port: modelserver }
            periodSeconds: 10
            failureThreshold: 60
          startupProbe:
            httpGet: { path: /v1/models, port: modelserver }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 80
      volumes:
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 8Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
  namespace: llm-d-pd
  labels: { llm-d.ai/role: decode, app: pd-decode }
spec:
  replicas: 1
  selector:
    matchLabels: { llm-d.ai/role: decode, app: pd-decode }
  template:
    metadata:
      labels:
        llm-d.ai/role: decode
        app: pd-decode
        llm-d.ai/inference-serving: "true"
        llm-d.ai/model: qwen2-5-1-5b
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { llm-d.ai/role: prefill }
              topologyKey: kubernetes.io/hostname
      tolerations:
        - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
        - { key: accelbench.io/multinode, operator: Equal, value: "true", effect: NoSchedule }
      nodeSelector: { accelbench.io/dra: "true" }
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: pd-gpu
      # Native sidecar (initContainer restartPolicy:Always) fronts vLLM on :8000,
      # proxies to vLLM :8200, and executes the P→D KV pull. With the EPP it reads
      # x-prefiller-host-port (set per-request by the EPP) — the same sidecar as
      # Layer 0, now driven by the scorer instead of a hand-set header.
      initContainers:
        - name: routing-proxy
          image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.9.0
          restartPolicy: Always
          args:
            - "--port=8000"
            - "--vllm-port=8200"
            - "--kv-connector=nixlv2"
            - "--zap-log-level=1"
            - "--secure-proxy=false"
          ports:
            - { name: sidecar, containerPort: 8000, protocol: TCP }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
      containers:
        - name: modelserver
          image: vllm/vllm-openai:v0.25.0
          command: ["vllm", "serve"]
          args:
            - "Qwen/Qwen2.5-1.5B-Instruct"
            - "--disable-access-log-for-endpoints=/health,/metrics,/v1/models"
            - "--tensor-parallel-size=1"
            - "--block-size=128"
            - "--kv-transfer-config"
            - '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
            - "--no-disable-hybrid-kv-cache-manager"
            - "--port=8200"
          env:
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: VLLM_NIXL_SIDE_CHANNEL_PORT
              value: "5600"
            - name: UCX_TLS
              value: "tcp,cuda_copy,cuda_ipc"
            - name: UCX_NET_DEVICES
              value: "all"
            - name: UCX_MODULE_DIR
              value: "/usr/local/lib/python3.12/dist-packages/nixl_cu13.libs/ucx"
            - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
              value: "120"
            - name: VLLM_LOGGING_LEVEL
              value: "DEBUG"
          ports:
            - { name: modelserver, containerPort: 8200, protocol: TCP }
            - { name: nixl, containerPort: 5600, protocol: TCP }
          resources:
            requests: { cpu: "3", memory: 12Gi }
            limits:   { memory: 12Gi }
            claims:   [ { name: gpu } ]
          volumeMounts:
            - { name: shm, mountPath: /dev/shm }
          readinessProbe:
            httpGet: { path: /v1/models, port: modelserver }
            periodSeconds: 10
            failureThreshold: 60
          startupProbe:
            httpGet: { path: /v1/models, port: modelserver }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 80
      volumes:
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 8Gi }
---
# Per-role Services (probes + the EPP endpoint discovery reads pods directly,
# but these help manual probing/debugging).
apiVersion: v1
kind: Service
metadata: { name: prefill, namespace: llm-d-pd }
spec:
  selector: { app: pd-prefill }
  ports: [ { name: http, port: 8000, targetPort: 8000 } ]
---
apiVersion: v1
kind: Service
metadata: { name: decode, namespace: llm-d-pd }
spec:
  selector: { app: pd-decode }
  ports: [ { name: http, port: 8000, targetPort: 8000 } ]  # sidecar entrypoint
---
# ── EPP / InferencePool (NET-NEW vs Layer 0) ────────────────────────────────
# One InferencePool over BOTH roles (rl-inferencepool.yaml / nixl-inferencepool.yaml).
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: pd-pool
  namespace: llm-d-pd
spec:
  targetPorts:
    - number: 8000   # prefill→vLLM:8000, decode→sidecar:8000
  selector:
    matchLabels:
      llm-d.ai/inference-serving: "true"
      llm-d.ai/model: qwen2-5-1-5b
  endpointPickerRef:
    name: pd-epp
    kind: Service
    port:
      number: 9002
    failureMode: FailOpen
---
# EPP scheduling config — threshold-gated PD (deploy/config/pd-epp-config.yaml
# @ v0.9.0). Avoids the hardware-specific peakPrefillThroughput calibration the
# guide's always-disagg config needs. nonCachedTokens:16 → disaggregate when the
# uncached prompt suffix ≥16 tokens. prefill-filter/decode-filter key on llm-d.ai/role.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pd-epp
  namespace: llm-d-pd
data:
  pd-config.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: approx-prefix-cache-producer
      parameters:
        maxPrefixBlocksToMatch: 256
        lruCapacityPerServer: 31250
    - type: prefix-cache-scorer
    - type: queue-scorer
    - type: prefill-filter
    - type: decode-filter
    - type: max-score-picker
    - type: prefix-based-pd-decider
      parameters:
        nonCachedTokens: 16
    - type: disagg-profile-handler
      parameters:
        deciders:
          prefill: prefix-based-pd-decider
    schedulingProfiles:
    - name: prefill
      plugins:
      - pluginRef: prefill-filter
      - pluginRef: max-score-picker
      - pluginRef: prefix-cache-scorer
        weight: 2
      - pluginRef: queue-scorer
        weight: 1
    - name: decode
      plugins:
      - pluginRef: decode-filter
      - pluginRef: max-score-picker
      - pluginRef: prefix-cache-scorer
        weight: 2
      - pluginRef: queue-scorer
        weight: 1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pd-epp
  namespace: llm-d-pd
---
# Namespaced Role: pods (endpoint discovery) + the GA inference CRDs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pd-epp
  namespace: llm-d-pd
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["inference.networking.k8s.io"]
    resources: ["inferencepools"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["inference.networking.x-k8s.io"]
    resources: ["inferenceobjectives", "inferencemodelrewrites"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pd-epp
  namespace: llm-d-pd
subjects:
  - kind: ServiceAccount
    name: pd-epp
    namespace: llm-d-pd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pd-epp
---
# ClusterRole: cluster-scoped auth reviews for metrics scraping (rl-rbac.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pd-epp-auth
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pd-epp-auth
subjects:
  - kind: ServiceAccount
    name: pd-epp
    namespace: llm-d-pd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pd-epp-auth
---
# EPP Deployment — v0.9.0 args from the routerlib Helm chart (_deployment.yaml).
# Single replica (prefix-cache/load state is process-local). CPU-only; schedules
# on a general node (no GPU/multinode tolerations).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pd-epp
  namespace: llm-d-pd
  labels: { app: pd-epp }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: pd-epp }
  template:
    metadata:
      labels: { app: pd-epp }
    spec:
      serviceAccountName: pd-epp
      terminationGracePeriodSeconds: 130
      containers:
        - name: epp
          image: ghcr.io/llm-d/llm-d-router-endpoint-picker:v0.9.0
          imagePullPolicy: IfNotPresent
          args:
            - --pool-name
            - pd-pool
            - --pool-namespace
            - llm-d-pd
            - --pool-group
            - inference.networking.k8s.io
            - --zap-encoder
            - json
            - --config-file
            - /config/pd-config.yaml
            - --grpc-health-port
            - "9003"
            - --tracing=false
            - --metrics-endpoint-auth=false
          ports:
            - { name: grpc, containerPort: 9002 }
            - { name: grpc-health, containerPort: 9003 }
            - { name: metrics, containerPort: 9090 }
          livenessProbe:
            grpc: { port: 9003, service: inference-extension }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc: { port: 9003, service: inference-extension }
            periodSeconds: 2
          env:
            - name: NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits:   { memory: 4Gi }
          volumeMounts:
            - { name: plugins-config-volume, mountPath: /config }
      volumes:
        - name: plugins-config-volume
          configMap:
            name: pd-epp
---
apiVersion: v1
kind: Service
metadata:
  name: pd-epp
  namespace: llm-d-pd
spec:
  type: ClusterIP
  selector: { app: pd-epp }
  ports:
    - { protocol: TCP, port: 9002, targetPort: 9002, appProtocol: http2 }
---
# HTTPRoute → InferencePool (rg-httproute.yaml). Cross-ns parentRef is allowed
# (gateway allowedRoutes.namespaces.from: All); route + pool are same-ns so no
# ReferenceGrant is needed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pd-route
  namespace: llm-d-pd
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: accelbench-gateway
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: pd-pool
      matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: "3600s"
